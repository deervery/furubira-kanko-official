# Public edge for the already-verified, resource-limited static nginx backend.
# Install only after the named certificate exists and HTTPS has been verified.
map $upstream_status $vps_tourism_static_cors {
    default '';
    200 '*';
    206 '*';
    304 '*';
}
server {
    listen 80;
    listen [::]:80;
    server_name furubira-kanko.com www.furubira-kanko.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/static-sites-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.furubira-kanko.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/furubira-kanko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/furubira-kanko.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=63072000' always;
    return 307 https://furubira-kanko.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name furubira-kanko.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/furubira-kanko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/furubira-kanko.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=63072000' always;
    add_header Access-Control-Allow-Origin $vps_tourism_static_cors always;
    location / {
        proxy_pass http://127.0.0.1:18098;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
