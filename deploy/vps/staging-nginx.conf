worker_processes 1;
error_log stderr warn;
pid /run/deervery-static-staging/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    types { text/javascript mjs; }
    access_log off;
    client_body_temp_path /tmp/deervery-static-body;
    include /opt/static-sites/*/current/nginx.conf;
}
