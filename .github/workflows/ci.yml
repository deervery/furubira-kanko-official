name: Go static regression gates
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Browser candidate: local generated files or verified VPS TLS origin"
        type: choice
        options: [local, vps]
        default: local
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision without Node
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fetch exactly the event revision (including the PR merge commit).
          test -n "$GITHUB_WORKSPACE" && test "$GITHUB_WORKSPACE" != /
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote remove origin 2>/dev/null || true
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # Authentication is scoped to this fetch process, never saved in .git/config.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1=core.hooksPath
          export GIT_CONFIG_VALUE_1=/dev/null
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1 auth GH_TOKEN
          git -c core.hooksPath=/dev/null checkout --force --detach "$GITHUB_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install verified go toolchain without Node
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          TOOL_VERSION: 1.27.4
        run: |
          python3 .github/ci/toolchain.py go --version "$TOOL_VERSION"
      - name: Install verified node toolchain without Node
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          TOOL_VERSION: 26.13.1
        run: |
          python3 .github/ci/toolchain.py node --version "$TOOL_VERSION"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./cmd/sitegen
        env:
          CONTACT_BOT_PROTECTION_ENABLED: 'true'
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: node --test
      - run: node --test tests/static-check.mjs
      - run: python3 tests/check-dom.py
      - name: Verify optional Excel maintenance tools in isolated fixtures
        run: |
          npm ci --prefix tools/translations --ignore-scripts --no-audit --no-fund
          npm test --prefix tools/translations
      - uses: actions/upload-artifact@v4
        with:
          name: go-static-site
          path: |
            out/
            .vercel/output/
          include-hidden-files: true
          retention-days: 7
  browsers:
    env:
      CANDIDATE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.origin == 'vps' && 'https://furubira-kanko.com' || '' }}
      VPS_ORIGIN_IP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.origin == 'vps' && '85.131.253.88' || '' }}
      VPS_ORIGIN_HOST: furubira-kanko.com
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout exact revision without Node
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fetch exactly the event revision (including the PR merge commit).
          test -n "$GITHUB_WORKSPACE" && test "$GITHUB_WORKSPACE" != /
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote remove origin 2>/dev/null || true
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # Authentication is scoped to this fetch process, never saved in .git/config.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1=core.hooksPath
          export GIT_CONFIG_VALUE_1=/dev/null
          git fetch --force --prune --tags origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch origin "$GITHUB_SHA"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1 auth GH_TOKEN
          git -c core.hooksPath=/dev/null checkout --force --detach "$GITHUB_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install verified node toolchain without Node
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          TOOL_VERSION: 24.22.3
        run: |
          python3 .github/ci/toolchain.py node --version "$TOOL_VERSION"
      - name: Build the pinned pre-migration reference
        run: |
          git worktree add --detach "$RUNNER_TEMP/reference" e68826e387e092540fec1a05aa0058ecc2ff4747
          cd "$RUNNER_TEMP/reference"
          npm ci --no-audit --no-fund
          npm run build
        env:
          NEXT_PUBLIC_DEERVERY_APEX_ENABLED: 'true'
          NEXT_PUBLIC_SHOP_READY: 'true'
          NEXT_PUBLIC_UNIFIED_FORMS_ENABLED: 'true'
          SITE_PREVIEW: 'false'
          CONTACT_BOT_PROTECTION_ENABLED: 'true'
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install verified go toolchain without Node
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          TOOL_VERSION: 1.27.4
        run: |
          python3 .github/ci/toolchain.py go --version "$TOOL_VERSION"
      - name: Install verified node toolchain without Node
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          TOOL_VERSION: 26.13.1
        run: |
          python3 .github/ci/toolchain.py node --version "$TOOL_VERSION"
      - run: go run ./cmd/sitegen
        env:
          CONTACT_BOT_PROTECTION_ENABLED: 'true'
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
      - run: npx --prefix tests/browser playwright install --with-deps ${{ matrix.browser }}
      - name: Compare pixels and interactions in isolated browsers
        working-directory: tests/browser
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          REFERENCE_DIR: ${{ runner.temp }}/reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
