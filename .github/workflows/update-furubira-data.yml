name: Update Furubira RAG data

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which URLs to scrape"
        type: choice
        options:
          - town
          - kanko
          - both
        default: both
      run_fix_content:
        description: "Run fixContent (OpenAI cost)"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run ingest (no DB writes)"
        type: boolean
        default: false
      delete:
        description: "Enable --delete (NOT recommended; purges missing hashes; needs RPC)"
        type: boolean
        default: false

  schedule:
    # Weekly (Mon) town news update. Cron is UTC.
    - cron: "0 0 * * 1"

concurrency:
  group: update-furubira-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Defaults for schedule runs
      SCOPE: ${{ github.event_name == 'schedule' && 'town' || inputs.scope }}
      RUN_FIX_CONTENT: ${{ github.event_name == 'schedule' && 'false' || inputs.run_fix_content }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      DO_DELETE: ${{ github.event_name == 'schedule' && 'false' || inputs.delete }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run update pipeline
        run: |
          set -euo pipefail
          # 1) scrape -> TEMP
          TMP="scripts/furubira_content._new.json"
          node scripts/scrapePage.mjs --scope "$SCOPE" --out "$TMP"

          # 2) optional cleanup (OpenAI cost)
          if [ "$RUN_FIX_CONTENT" = "true" ]; then
            node scripts/fixContent.mjs --source "$TMP" --out "$TMP"
          fi

          # 3) merge into per-scope dataset
          if [ "$SCOPE" = "town" ]; then
            node scripts/merge-furubira-content.mjs --into scripts/furubira_content.town.json --from "$TMP"
          elif [ "$SCOPE" = "kanko" ]; then
            node scripts/merge-furubira-content.mjs --into scripts/furubira_content.kanko.json --from "$TMP"
          elif [ "$SCOPE" = "both" ]; then
            node scripts/merge-furubira-content.mjs --into scripts/furubira_content.both.json --from "$TMP"
          else
            echo "ERROR: unexpected scope: $SCOPE"
            exit 1
          fi

          # 4) always rebuild BOTH from current town+kanko snapshots (if present)
          rm -f scripts/furubira_content.both.json
          if [ -f scripts/furubira_content.town.json ]; then
            node scripts/merge-furubira-content.mjs --into scripts/furubira_content.both.json --from scripts/furubira_content.town.json
          fi
          if [ -f scripts/furubira_content.kanko.json ]; then
            node scripts/merge-furubira-content.mjs --into scripts/furubira_content.both.json --from scripts/furubira_content.kanko.json
          fi

          # Keep a stable alias for app/local use
          cp scripts/furubira_content.both.json scripts/furubira_content.json
          # Build ONE canonical info JSON (title/content only) from BOTH
          node scripts/build-furubira-info.mjs --source scripts/furubira_content.both.json --out scripts/furubira_info.json

          # Safety: allow --delete only when we ingest from BOTH dataset.
          # (We always ingest from furubira_content.both.json below.)

          # 5) ingest (diff update: content_hash + embedding) from BOTH dataset (title/content only)
          ARGS=(--source scripts/furubira_info.json)
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$DO_DELETE" = "true" ]; then ARGS+=(--delete); fi
          node scripts/ingest-furubira-info.mjs "${ARGS[@]}"

          # cleanup temp
          rm -f "$TMP"


